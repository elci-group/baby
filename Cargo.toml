[package]
name = "baby"
version = "0.2.12"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
signal-hook = "0.3"
libc = "0.2"
log = { version = "0.4", features = ["std"] }
clap_mangen = "0.2"
anstyle = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = false
