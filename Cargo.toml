[workspace]
members = [
    "crates/baby",
    "crates/birthd",
    "crates/birthctl",
    "crates/boaring",
    "crates/boarish",
    "crates/boar",
    "crates/boar-core",
    "crates/boar-index",
]
resolver = "3"

[workspace.package]
version = "0.10.6"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/elci-group/baby"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
signal-hook = "0.3"
libc = "0.2"
log = { version = "0.4", features = ["std"] }
clap_mangen = "0.2"
anstyle = "1"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread", "sync", "time"] }
rayon = "1.8"
chrono = "0.4"
num_cpus = "1"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
rusqlite = { version = "0.34", features = ["bundled"] }
criterion = { version = "0.5", features = ["html_reports"] }
escargot = "0.5"
form3 = { path = "../3form" }

# workspace members
baby = { path = "crates/baby" }
birthctl = { path = "crates/birthctl" }
birthd = { path = "crates/birthd" }
boaring = { path = "crates/boaring" }
boarish = { path = "crates/boarish" }
boar = { path = "crates/boar" }
boar-core = { path = "crates/boar-core" }
boar-index = { path = "crates/boar-index" }

[profile.release]
strip = false
lto = "thin"
