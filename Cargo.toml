[package]
name = "baby"
version = "0.4.32"
edition = "2024"
description = "Build projects from validated installation recipes and install their declared binaries."
license = "MIT"
repository = "https://github.com/elci-group/baby"
keywords = ["installer", "build", "cli", "automation", "recipes"]

[dependencies]
clap = { version = "4", features = ["derive"] }
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
signal-hook = "0.3"
libc = "0.2"
log = { version = "0.4", features = ["std"] }
clap_mangen = "0.2"
anstyle = "1"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
rayon = "1.8"
tabled = "0.15"
chrono = "0.4"
num_cpus = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = false
