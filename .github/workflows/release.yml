name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo state
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Package binaries
        run: |
          mkdir -p baby-linux-x86_64
          cp target/release/baby baby-linux-x86_64/
          cp target/release/birthctl baby-linux-x86_64/
          cp target/release/birthd baby-linux-x86_64/
          tar czf baby-linux-x86_64.tar.gz baby-linux-x86_64

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: baby-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
